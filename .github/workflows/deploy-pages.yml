name: Deploy web demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the exact version this app was built and verified
          # against locally (flutter analyze/test/build all passed) —
          # floating on "stable" pulled a newer release with a web/dart2js
          # regression (CupertinoPageTransitionsBuilder unresolved).
          flutter-version: 3.41.7

      - run: flutter pub get

      - run: flutter build web --release --base-href /hyperdynamics-loyalty-manager/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
